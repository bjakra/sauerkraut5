# Meson cross file for build-mesa.sh --cross: armv7 musl (Alpine's ABI) with clang and lld, against the
# Alpine armv7 packages unpacked at /sysroot in the build container.
[constants]
target = ['--target=armv7-alpine-linux-musleabihf', '--sysroot=/sysroot', '-march=armv7-a', '-mfpu=neon', '-mfloat-abi=hard', '-mthumb']

[binaries]
c = ['clang'] + target
cpp = ['clang++'] + target
ar = 'llvm-ar'
strip = 'llvm-strip'
ranlib = 'llvm-ranlib'
nm = 'llvm-nm'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld']

[properties]
sys_root = '/sysroot'
pkg_config_libdir = ['/sysroot/usr/lib/pkgconfig', '/sysroot/usr/share/pkgconfig']
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
